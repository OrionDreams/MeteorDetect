name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  PYTHON_VERSION: "3.11"
  APP_NAME: MeteorDetect

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime-downloads/ffmpeg, runtime-downloads/ffmpeg-src | Out-Null
          Invoke-WebRequest -Uri https://github.com/binmgr/ffmpeg/releases/latest/download/ffmpeg-windows-amd64.zip -OutFile runtime-downloads/ffmpeg.zip
          Expand-Archive runtime-downloads/ffmpeg.zip -DestinationPath runtime-downloads/ffmpeg-src
          Copy-Item (Get-ChildItem runtime-downloads/ffmpeg-src -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName runtime-downloads/ffmpeg/ffmpeg.exe
          Copy-Item (Get-ChildItem runtime-downloads/ffmpeg-src -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName runtime-downloads/ffmpeg/ffprobe.exe

      - name: Build detector executable
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --name meteor-detector --onefile --clean --hidden-import meteor_detector.detector --collect-all cv2 meteor_detector/cli.py

      - name: Publish app
        run: dotnet publish src/MeteorDetect.App/MeteorDetect.App.csproj -c Release -r win-x64 -o artifacts/publish/win-x64 /p:PublishTrimmed=false

      - name: Stage package
        shell: pwsh
        run: |
          $packageRoot = "artifacts/package/${env:APP_NAME}"
          New-Item -ItemType Directory -Force $packageRoot | Out-Null
          Copy-Item artifacts/publish/win-x64/* $packageRoot -Recurse
          Copy-Item meteor_detector $packageRoot/meteor_detector -Recurse
          Copy-Item resolve_importer $packageRoot/resolve_importer -Recurse
          Copy-Item config.example.json,requirements.txt,README.md $packageRoot
          New-Item -ItemType Directory -Force $packageRoot/runtime/detector | Out-Null
          Copy-Item dist/meteor-detector.exe $packageRoot/runtime/detector/meteor-detector.exe
          New-Item -ItemType Directory -Force $packageRoot/runtime/ffmpeg | Out-Null
          Copy-Item runtime-downloads/ffmpeg/ffmpeg.exe $packageRoot/runtime/ffmpeg/ffmpeg.exe
          Copy-Item runtime-downloads/ffmpeg/ffprobe.exe $packageRoot/runtime/ffmpeg/ffprobe.exe

      - name: Create zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Compress-Archive -Path artifacts/package/${env:APP_NAME} -DestinationPath artifacts/release/${env:APP_NAME}-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeteorDetect-windows-x64
          path: artifacts/release/MeteorDetect-windows-x64.zip

  linux:
    name: Linux x64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file

      - name: Download FFmpeg
        run: |
          mkdir -p runtime-downloads/ffmpeg runtime-downloads/ffmpeg-src
          curl -L -o runtime-downloads/ffmpeg.tar.gz https://github.com/binmgr/ffmpeg/releases/latest/download/ffmpeg-linux-amd64.tar.gz
          tar -xzf runtime-downloads/ffmpeg.tar.gz -C runtime-downloads/ffmpeg-src
          cp "$(find runtime-downloads/ffmpeg-src -type f -name ffmpeg | head -n 1)" runtime-downloads/ffmpeg/ffmpeg
          cp "$(find runtime-downloads/ffmpeg-src -type f -name ffprobe | head -n 1)" runtime-downloads/ffmpeg/ffprobe
          chmod +x runtime-downloads/ffmpeg/ffmpeg runtime-downloads/ffmpeg/ffprobe

      - name: Build detector executable
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --name meteor-detector --onefile --clean --hidden-import meteor_detector.detector --collect-all cv2 meteor_detector/cli.py

      - name: Publish app
        run: dotnet publish src/MeteorDetect.App/MeteorDetect.App.csproj -c Release -r linux-x64 -o artifacts/publish/linux-x64 /p:PublishTrimmed=false

      - name: Stage package
        run: |
          package_root="artifacts/package/${APP_NAME}"
          mkdir -p "$package_root"
          cp -a artifacts/publish/linux-x64/. "$package_root/"
          cp -a meteor_detector "$package_root/meteor_detector"
          cp -a resolve_importer "$package_root/resolve_importer"
          cp config.example.json requirements.txt README.md "$package_root/"
          mkdir -p "$package_root/runtime/detector" "$package_root/runtime/ffmpeg"
          cp dist/meteor-detector "$package_root/runtime/detector/meteor-detector"
          cp runtime-downloads/ffmpeg/ffmpeg "$package_root/runtime/ffmpeg/ffmpeg"
          cp runtime-downloads/ffmpeg/ffprobe "$package_root/runtime/ffmpeg/ffprobe"
          chmod +x "$package_root/MeteorDetect" "$package_root/runtime/detector/meteor-detector" "$package_root/runtime/ffmpeg/ffmpeg" "$package_root/runtime/ffmpeg/ffprobe"

      - name: Create tar.gz
        run: |
          mkdir -p artifacts/release
          tar -C artifacts/package -czf artifacts/release/${APP_NAME}-linux-x64.tar.gz ${APP_NAME}

      - name: Create AppImage
        run: |
          appdir="artifacts/appimage/${APP_NAME}.AppDir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/icons/hicolor/256x256/apps" "$appdir/usr/share/icons/hicolor/512x512/apps"
          cp -a "artifacts/package/${APP_NAME}/." "$appdir/usr/bin/"
          cp media/icons/png/MeteorDetect-256.png "$appdir/${APP_NAME}.png"
          cp media/icons/png/MeteorDetect-256.png "$appdir/usr/share/icons/hicolor/256x256/apps/${APP_NAME}.png"
          cp media/icons/png/MeteorDetect-512.png "$appdir/usr/share/icons/hicolor/512x512/apps/${APP_NAME}.png"
          cat > "$appdir/${APP_NAME}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=${APP_NAME}
          Exec=${APP_NAME}
          Icon=${APP_NAME}
          Categories=AudioVideo;Video;
          EOF
          cat > "$appdir/AppRun" <<'EOF'
          #!/usr/bin/env sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/MeteorDetect" "$@"
          EOF
          chmod +x "$appdir/AppRun"
          curl -L -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool "$appdir" "artifacts/release/${APP_NAME}-linux-x64.AppImage"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MeteorDetect-linux-x64
          path: |
            artifacts/release/MeteorDetect-linux-x64.tar.gz
            artifacts/release/MeteorDetect-linux-x64.AppImage

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rid: osx-arm64
            ffmpeg_arch: arm64
            runner: macos-15
          - arch: x64
            rid: osx-x64
            ffmpeg_arch: amd64
            runner: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download FFmpeg
        run: |
          mkdir -p runtime-downloads/ffmpeg runtime-downloads/ffmpeg-src
          curl -L -o runtime-downloads/ffmpeg.tar.gz https://github.com/binmgr/ffmpeg/releases/latest/download/ffmpeg-darwin-${{ matrix.ffmpeg_arch }}.tar.gz
          tar -xzf runtime-downloads/ffmpeg.tar.gz -C runtime-downloads/ffmpeg-src
          cp "$(find runtime-downloads/ffmpeg-src -type f -name ffmpeg | head -n 1)" runtime-downloads/ffmpeg/ffmpeg
          cp "$(find runtime-downloads/ffmpeg-src -type f -name ffprobe | head -n 1)" runtime-downloads/ffmpeg/ffprobe
          chmod +x runtime-downloads/ffmpeg/ffmpeg runtime-downloads/ffmpeg/ffprobe

      - name: Build detector executable
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --name meteor-detector --onefile --clean --hidden-import meteor_detector.detector --collect-all cv2 meteor_detector/cli.py

      - name: Publish app
        run: dotnet publish src/MeteorDetect.App/MeteorDetect.App.csproj -c Release -r ${{ matrix.rid }} -o artifacts/publish/${{ matrix.rid }} /p:PublishTrimmed=false

      - name: Stage app bundle
        run: |
          app_bundle="artifacts/package/${APP_NAME}.app"
          macos_dir="$app_bundle/Contents/MacOS"
          resources_dir="$app_bundle/Contents/Resources"
          mkdir -p "$macos_dir" "$resources_dir"
          cp -a artifacts/publish/${{ matrix.rid }}/. "$macos_dir/"
          cp -a meteor_detector "$macos_dir/meteor_detector"
          cp -a resolve_importer "$macos_dir/resolve_importer"
          cp config.example.json requirements.txt README.md "$macos_dir/"
          mkdir -p "$macos_dir/runtime/detector" "$macos_dir/runtime/ffmpeg"
          cp dist/meteor-detector "$macos_dir/runtime/detector/meteor-detector"
          cp runtime-downloads/ffmpeg/ffmpeg "$macos_dir/runtime/ffmpeg/ffmpeg"
          cp runtime-downloads/ffmpeg/ffprobe "$macos_dir/runtime/ffmpeg/ffprobe"
          cp media/icons/MeteorDetect.icns "$resources_dir/MeteorDetect.icns"
          chmod +x "$macos_dir/MeteorDetect" "$macos_dir/runtime/detector/meteor-detector" "$macos_dir/runtime/ffmpeg/ffmpeg" "$macos_dir/runtime/ffmpeg/ffprobe"
          cat > "$app_bundle/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>MeteorDetect</string>
            <key>CFBundleIdentifier</key>
            <string>com.meteordetect.app</string>
            <key>CFBundleName</key>
            <string>MeteorDetect</string>
            <key>CFBundleDisplayName</key>
            <string>MeteorDetect</string>
            <key>CFBundleIconFile</key>
            <string>MeteorDetect</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${GITHUB_REF_NAME:-0.0.0}</string>
            <key>CFBundleVersion</key>
            <string>${GITHUB_RUN_NUMBER}</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Create dmg
        run: |
          mkdir -p artifacts/release
          dmg_path="artifacts/release/${APP_NAME}-macos-${{ matrix.arch }}.dmg"
          hdiutil create -volname "${APP_NAME}" -srcfolder "artifacts/package/${APP_NAME}.app" -ov -format UDZO "$dmg_path"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeteorDetect-macos-${{ matrix.arch }}
          path: artifacts/release/MeteorDetect-macos-${{ matrix.arch }}.dmg

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - windows
      - linux
      - macos
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/release
          merge-multiple: true

      - name: Attach files to release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/release/MeteorDetect-windows-x64.zip
            artifacts/release/MeteorDetect-linux-x64.tar.gz
            artifacts/release/MeteorDetect-linux-x64.AppImage
            artifacts/release/MeteorDetect-macos-arm64.dmg
            artifacts/release/MeteorDetect-macos-x64.dmg
